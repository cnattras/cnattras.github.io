<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html><head><meta content="text/html; charset=ISO-8859-1" http-equiv="content-type"><title>GinasVegetableDip</title></head><body><font size="2" face="sans-serif">Gina's Vegetable Dip</font>
<br>


<br>

<font size="2" face="sans-serif">Mix the day before:</font>
<br>

<font size="2" face="sans-serif">1 cup sour cream</font>
<br>

<font size="2" face="sans-serif">2 cups mayonaise</font>
<br>

<font size="2" face="sans-serif">1 Tablespoon parsley</font>
<br>

<font size="2" face="sans-serif">1 teaspoon sugar</font>
<br>

<font size="2" face="sans-serif">1/2 teaspoon garlic</font>
<br>

<font size="2" face="sans-serif">2 Tablespoons parmesan cheese</font>
<br>

<font size="2" face="sans-serif">1 Cup shredded mozarella</font>
<br>

<font size="2" face="sans-serif">1 Tablespoon minced onion</font>
<br>

<font size="2" face="sans-serif">1 teaspoon salt</font>
<br>

<font size="2" face="sans-serif">1 teaspoon pepper</font>
<br>


<br>

</body></html>
