<br>
1/3 c butter in 2 c sauce pan, stir in 1/3 c flour and 1/3 c onion + 1/2 tsp salt + 1/4 tsp pepper<br>
<br>
add 1 3/4 c broth, 2/3 c milk boil 1 min<br>
<br>
add 2.5 c chicken/ turkey, 1 c peas, 1 c carrots<br>
<br>
for 1 square cake<br>
