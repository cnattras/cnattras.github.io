<br>


<br>

<font size="2" face="sans-serif">In a food processor, gently blend
6 ounces of cream cheese, 2/3 cup butter, 2 cup flour, 1 teaspoon salt
(and sugar if the crust will be used for a desert pie). &nbsp;Pulse blend
until it forms a ball, &nbsp;Roll out.</font>
<br>
