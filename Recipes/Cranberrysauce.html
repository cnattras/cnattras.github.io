<html><head><meta content="text/html; charset=ISO-8859-1" http-equiv="content-type"><title>Cranberry sauce</title></head><body><span style="font-weight: bold;">Cranberry Sauce</span><br>
<br>
In a medium pot, bring to a boil:<br>
1 cup water<br>
1 cup sugar<br>
7 grams unflavored gelatin<br>
<br>
add:<br>
1 bag (12 oz/ 340 g) cranberries<br>
bring to a boil again and boil for 10 minutes<br>
<br>
<span style="font-weight: bold;">Source</span>:&nbsp; altered from the back of the Ocean Spray cranberry package<br>
<br>
<span style="font-weight: bold;">Notes:</span>&nbsp; Goes well with roast turkey<br>
</body></html>
