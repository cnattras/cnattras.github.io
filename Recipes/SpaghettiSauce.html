<html><head><meta content="text/html; charset=ISO-8859-1" http-equiv="content-type"><title>Spaghetti sauce</title></head><body><span style="font-weight: bold;">Spaghetti sauce</span><br>
<br>
Fry in olive oil about 8 minutes<br>
1 bulk garlic, crushed<br>
3 onions<br>
<br>
Add<br>
handful of fresh basil, chopped<br>
handful of fresh oregano, chopped<br>
heat ~2 min.<br>
<br>
Add two 28 oz cans of diced, peeled tomatoes and 2-3 bay leaves and salt to taste<br>
<br>
Simmer ~2 hrs<br>
</body></html>
