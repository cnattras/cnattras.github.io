<meta content="text/html; charset=ISO-8859-1" http-equiv="content-type"><title>Christine's Pumpkin Pie</title></head><body>Christine's Pumpkin Pie<br>
<br>
1.5 c pumpkin<br>3 eggs<br>
2/3 c milk<br>
1.5 tsp cinnamon<br>
1/8 tsp cloves<br>
dash of nutmeg<br>
1/4 tsp ginger<br>
1/2 tsp salt<br>
3/4 c sugar<br>
Pie crust<br>
<br>
Makes 1 pie<br>
<br>
<br>
Cook for about 30-45 min. at 350F, until a knife stuck in comes out clean.<br>
</body></html>
