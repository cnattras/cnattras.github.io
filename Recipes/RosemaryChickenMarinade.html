<html><head><meta content="text/html; charset=ISO-8859-1" http-equiv="content-type"><title>Rosemary Chicken Marinade</title></head><body><span style="font-weight: bold;">Rosemary chicken marinade</span><br>
Juice from 3 lemons<br>
About 1/4 c fresh rosemary<br>
1 tbsp pepper<br>
1/2 bulb garlic, peeled<br>
Mix everything above in food chopper &amp; puree<br>
Add ~1/4 c olive oil<br>
Marinate ~6 chicken breasts in it.<br>


</body></html>
