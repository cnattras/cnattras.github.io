<html><head><meta content="text/html; charset=ISO-8859-1" http-equiv="content-type"><title>Garlic Mashed Potatoes</title></head><body><span style="font-weight: bold;">Garlic smashed potatoes:</span> 10/10<br>
Boil until soft (about 30 minutes):<br>
&nbsp;&nbsp;&nbsp; 1.2-1.3 kg of potatoes (3 large)<br>
&nbsp;&nbsp;&nbsp; 3 cloves garlic<br>
<br>
add:<br>
3/4 cup butter<br>
3 basil leaves<br>
1.5 tsp salt<br>
1.5 tsp pepper<br>
1 tbsp parsley<br>
3/4 c milk<br>
<br>
<span style="font-weight: bold;">Source:</span> me<br>
<br>
<span style="font-weight: bold;">Notes:</span>&nbsp; maybe too much salt and pepper.&nbsp; Don't add all of it at first.<br>
</body></html>
