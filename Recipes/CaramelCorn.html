<!DOCTYPE html>

    <title>Caramel Corn</title>
  </head>
  <body>
    <h1><strong>Caramel corn</strong></h1>
    <p>4 tbsp butter (1/2 stick)</p>
    <p>2 tbsp water</p>
    <p>1/2 c packed brown sugar</p>
    <p>Bring above to a boil.&nbsp; Allow to cool slightly.</p>
    <p>Pop 1/2 c pop corn.&nbsp; Spread over caramel corn.&nbsp; Bake for about
      30 minutes at 350 F.</p>
  </body>
</html>
