<html><head><meta content="text/html; charset=ISO-8859-1" http-equiv="content-type"><title>Pecan Pie</title></head><body>Pecan Pie<br>
<br>
1/2 c sugar<br>
2 tbsp butter, cut into chunks<br>
2 tbsp flour<br>
2 eggs 1/4 tsp salt<br>
2 tsp almond extract<br>
2 tsp vanilla extract<br>
1 c corn syrup<br>
2 c whole pecans<br>
pie crush<br>
<br>
Mix everything except pecans.&nbsp; Add pecans.&nbsp; Cook 350 F for 30-45 min.<br>
</body></html>
