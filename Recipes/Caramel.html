<!DOCTYPE html>
<html>
  <head>
    <meta content="text/html; charset=windows-1252" http-equiv="content-type">
    <title>Caramel</title>
  </head>
  <body>
    <h1><span style="font-weight: bold;"><span style="font-weight: normal;">Caramel</span></span></h1>
    <p>
      <meta http-equiv="content-type" content="text/html; charset=utf-8">
      1.5 cups sugar<br>
      1/2 cup honey (Colorado wildflower is very good!)<br>
      1 tbsp vanilla extract<br>
      1 cup heavy cream<br>
      4oz (1 stick) butter</p>
    <p>Heat on medium until it reaches 220F, then turn heat down and bring to
      260F, stirring constantly.&nbsp; Place in some form.</p>
  </body>
</html>
