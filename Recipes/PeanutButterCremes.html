<html><head><meta content="text/html; charset=ISO-8859-1" http-equiv="content-type"><title>Peanut Butter Cremes</title></head><body><span style="font-weight: bold;">Peanut Butter Cremes 10/10</span><br>
Cream together:<br>
1 c peanut butter&nbsp; (all natural)<br>
3/4 c milk or cream<br>
1/3 c powdered sugar<br>
Stick in freezer at least 1 hour until hard.&nbsp; Form into balls.&nbsp; Dip as with chocolate covered fruits.<br>
</body></html>
